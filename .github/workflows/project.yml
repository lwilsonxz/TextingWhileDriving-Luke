name: Project

# Imports the Godot project and runs every scene for a few frames, failing on
# any error. Catches broken paths, missing resources and errors in _ready().
on:
  pull_request:
    paths:
      - "TextingWhileDriving/**"
      - "tools/check_scenes.gd"
      - "tools/ci/**"
      - "tools/tests/test_dialogue_playtest.gd"
      - "tools/tests/test_car.gd"
      - "tools/tests/test_course.gd"
      - "tools/tests/test_phone.gd"
      - "tools/tests/test_rules.gd"
      - "tools/tests/test_level_pieces.gd"
      - "tools/setup_yarn_spinner.sh"
      - ".github/workflows/project.yml"
  push:
    branches: [main]
    paths:
      - "TextingWhileDriving/**"
      - "tools/check_scenes.gd"
      - "tools/ci/**"
      - "tools/tests/test_dialogue_playtest.gd"
      - "tools/tests/test_car.gd"
      - "tools/tests/test_course.gd"
      - "tools/tests/test_phone.gd"
      - "tools/tests/test_rules.gd"
      - "tools/tests/test_level_pieces.gd"
      - "tools/setup_yarn_spinner.sh"
      - ".github/workflows/project.yml"
  workflow_dispatch:

# Each step uses the same tools a developer installs (see the README's Setup).
# Godot itself is cached between runs. Godot commands go through
# tools/ci/run_godot.sh, which also fails on any printed script error and on
# a hang.
jobs:
  scenes:
    runs-on: ubuntu-latest
    env:
      # Keep these in step with the README and tools/setup_yarn_spinner.*.
      GODOT_VERSION: "4.6.3"
      YSC_VERSION: "3.2.2"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install the Yarn compiler
        run: |
          dotnet tool install --global YarnSpinner.Console --version "$YSC_VERSION"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot

      - name: Add Godot to PATH
        run: echo "$HOME/godot" >> "$GITHUB_PATH"

      - name: Install the Yarn Spinner addon
        run: tools/setup_yarn_spinner.sh TextingWhileDriving

      - name: Import the project
        run: tools/ci/run_godot.sh godot --headless --path TextingWhileDriving --import

      - name: Run every scene
        run: tools/ci/run_godot.sh godot --headless --path TextingWhileDriving --script res://../tools/check_scenes.gd

      - name: Test the dialogue playtest scene
        run: tools/ci/run_godot.sh godot --headless --path TextingWhileDriving --script res://../tools/tests/test_dialogue_playtest.gd

      - name: Test the car and camera
        run: tools/ci/run_godot.sh godot --headless --path TextingWhileDriving --script res://../tools/tests/test_car.gd

      - name: Test the course
        run: tools/ci/run_godot.sh godot --headless --path TextingWhileDriving --script res://../tools/tests/test_course.gd

      - name: Test the phone in the car
        run: tools/ci/run_godot.sh godot --headless --path TextingWhileDriving --script res://../tools/tests/test_phone.gd

      - name: Test the traffic rules
        run: tools/ci/run_godot.sh godot --headless --path TextingWhileDriving --script res://../tools/tests/test_rules.gd

      - name: Test the level template and pieces
        run: tools/ci/run_godot.sh godot --headless --path TextingWhileDriving --script res://../tools/tests/test_level_pieces.gd
